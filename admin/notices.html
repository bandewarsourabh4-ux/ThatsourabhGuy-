<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notices Management - Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--surface);
            border-radius: 12px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 14px;
        }

        .form-input {
            width: 100%;
        }

        textarea.form-input {
            resize: vertical;
            min-height: 100px;
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            justify-content: flex-end;
        }

        .search-container {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .search-container input {
            flex: 1;
            max-width: 300px;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 8px 16px;
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: 20px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 13px;
        }

        .filter-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .notice-item {
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 12px;
            transition: var(--transition);
        }

        .notice-item:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .notice-title {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .notice-meta {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .notice-badge {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            background: var(--primary-light);
            color: var(--primary);
        }

        .notice-badge.high {
            background: #fecaca;
            color: #dc2626;
        }

        .notice-badge.medium {
            background: #fed7aa;
            color: #ea580c;
        }

        .notice-description {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .notice-actions {
            display: flex;
            gap: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--surface);
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-content {
            animation: slideIn 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">📚</div>
                <h2>SmartHub Admin</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link"><span class="icon">📊</span><span>Dashboard</span></a>
                <a href="students.html" class="nav-link"><span class="icon">👥</span><span>Students</span></a>
                <a href="attendance.html" class="nav-link"><span class="icon">✓</span><span>Attendance</span></a>
                <a href="assignments.html" class="nav-link"><span class="icon">📝</span><span>Assignments</span></a>
                <a href="study-material.html" class="nav-link"><span class="icon">📚</span><span>Study Material</span></a>
                <a href="results.html" class="nav-link"><span class="icon">📈</span><span>Results</span></a>
                <a href="timetable.html" class="nav-link"><span class="icon">📅</span><span>Timetable</span></a>
                <a href="notices.html" class="nav-link active"><span class="icon">📢</span><span>Notices</span></a>
                <a href="settings.html" class="nav-link"><span class="icon">⚙️</span><span>Settings</span></a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="header">
                <div class="header-content">
                    <h1>Notice Management</h1>
                    <div class="header-actions">
                        <button class="btn-theme" onclick="toggleTheme()">🌙</button>
                    </div>
                </div>
            </header>

            <div class="content-area">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="totalNotices">5</div>
                        <div class="stat-label">Total Notices</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="highPriority">2</div>
                        <div class="stat-label">High Priority</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="activeNotices">5</div>
                        <div class="stat-label">Active</div>
                    </div>
                </div>

                <div class="search-container">
                    <input type="text" id="searchInput" class="form-input" placeholder="Search notices..." onkeyup="filterNotices()">
                    <button class="btn" onclick="openNoticeModal()">➕ Create Notice</button>
                </div>

                <div class="filter-tabs">
                    <button class="filter-tab active" onclick="filterByCategory('All')">All</button>
                    <button class="filter-tab" onclick="filterByCategory('Academic')">Academic</button>
                    <button class="filter-tab" onclick="filterByCategory('Examination')">Examination</button>
                    <button class="filter-tab" onclick="filterByCategory('Events')">Events</button>
                    <button class="filter-tab" onclick="filterByCategory('Placement')">Placement</button>
                    <button class="filter-tab" onclick="filterByCategory('General')">General</button>
                </div>

                <div id="noticesList"></div>
            </div>
        </main>
    </div>

    <div id="noticeModal" class="modal" onclick="closeNoticeModalOnBackdrop(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span id="modalTitle">Create New Notice</span>
                <button class="modal-close" onclick="ModalManager.closeModal('noticeModal')">&times;</button>
            </div>
            <form id="noticeForm" onsubmit="saveNotice(event)">
                <div class="form-group">
                    <label class="form-label">Title</label>
                    <input type="text" id="noticeTitle" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea id="noticeDescription" class="form-input" required></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select id="noticeCategory" class="form-input" required>
                        <option value="">Select Category</option>
                        <option value="Academic">Academic</option>
                        <option value="Examination">Examination</option>
                        <option value="Events">Events</option>
                        <option value="Placement">Placement</option>
                        <option value="General">General</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Priority</label>
                    <select id="noticePriority" class="form-input" required>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn secondary" onclick="ModalManager.closeModal('noticeModal')">Cancel</button>
                    <button type="submit" class="btn">Save Notice</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        let noticesData = [];
        let filteredNotices = [];
        let currentFilter = 'All';
        let editingNoticeId = null;

        document.addEventListener('DOMContentLoaded', function() {
            if (!app.checkAuth() || !app.isAdmin()) window.location.href = '../index.html';
            noticesData = SmartHubData.getNotices();
            filteredNotices = [...noticesData];
            updateStats();
            displayNotices();
        });

        function updateStats() {
            document.getElementById('totalNotices').textContent = noticesData.length;
            document.getElementById('highPriority').textContent = noticesData.filter(n => n.priority === 'High').length;
            document.getElementById('activeNotices').textContent = noticesData.length;
        }

        function displayNotices() {
            const container = document.getElementById('noticesList');
            if (filteredNotices.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-secondary);">No notices found</div>';
                return;
            }

            container.innerHTML = filteredNotices.map(notice => `
                <div class="notice-item">
                    <div class="notice-title">${notice.title}</div>
                    <div class="notice-meta">
                        <span class="notice-badge">${notice.category}</span>
                        <span class="notice-badge ${notice.priority.toLowerCase()}">${notice.priority} Priority</span>
                        <span style="color: var(--text-secondary); font-size: 13px;">${formatDate(notice.date)}</span>
                    </div>
                    <div class="notice-description">${notice.description}</div>
                    <div class="notice-actions">
                        <button class="btn btn-sm" onclick="editNotice('${notice.id}')">✏️ Edit</button>
                        <button class="btn btn-sm danger" onclick="deleteNotice('${notice.id}')">🗑️ Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function openNoticeModal() {
            editingNoticeId = null;
            document.getElementById('modalTitle').textContent = 'Create New Notice';
            document.getElementById('noticeForm').reset();
            ModalManager.openModal('noticeModal');
        }

        function editNotice(id) {
            const notice = noticesData.find(n => n.id === id);
            if (notice) {
                editingNoticeId = id;
                document.getElementById('modalTitle').textContent = 'Edit Notice';
                document.getElementById('noticeTitle').value = notice.title;
                document.getElementById('noticeDescription').value = notice.description;
                document.getElementById('noticeCategory').value = notice.category;
                document.getElementById('noticePriority').value = notice.priority;
                ModalManager.openModal('noticeModal');
            }
        }

        function saveNotice(event) {
            event.preventDefault();
            const title = document.getElementById('noticeTitle').value;
            const description = document.getElementById('noticeDescription').value;
            const category = document.getElementById('noticeCategory').value;
            const priority = document.getElementById('noticePriority').value;

            if (editingNoticeId) {
                const notice = noticesData.find(n => n.id === editingNoticeId);
                if (notice) {
                    notice.title = title;
                    notice.description = description;
                    notice.category = category;
                    notice.priority = priority;
                    showToast('Notice updated successfully', 'success');
                }
            } else {
                const newId = 'N' + String(Math.max(...noticesData.map(n => parseInt(n.id.substring(1))), 0) + 1).padStart(3, '0');
                noticesData.push({
                    id: newId,
                    title,
                    description,
                    category,
                    priority,
                    date: new Date().toISOString().split('T')[0]
                });
                showToast('Notice created successfully', 'success');
            }

            ModalManager.closeModal('noticeModal');
            updateStats();
            filterNotices();
        }

        function deleteNotice(id) {
            if (confirm('Are you sure you want to delete this notice?')) {
                noticesData = noticesData.filter(n => n.id !== id);
                updateStats();
                filterNotices();
                showToast('Notice deleted successfully', 'success');
            }
        }

        function filterByCategory(category) {
            currentFilter = category;
            document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            filterNotices();
        }

        function filterNotices() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            filteredNotices = noticesData.filter(notice => {
                const matchesSearch = notice.title.toLowerCase().includes(searchTerm) ||
                                    notice.description.toLowerCase().includes(searchTerm);
                const matchesCategory = currentFilter === 'All' || notice.category === currentFilter;
                return matchesSearch && matchesCategory;
            });
            displayNotices();
        }

        function closeNoticeModalOnBackdrop(event) {
            if (event.target.id === 'noticeModal') {
                ModalManager.closeModal('noticeModal');
            }
        }
    </script>
</body>
</html>
