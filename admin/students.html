<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Management - Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .admin-toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .search-bar {
            flex: 1;
            min-width: 250px;
            display: flex;
            gap: 12px;
        }

        .search-bar input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
        }

        .table-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th {
            background: var(--surface-secondary);
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
        }

        table td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        table tr:hover {
            background: var(--surface-secondary);
        }

        .action-buttons {
            display: flex;
            gap: 6px;
        }

        .action-buttons button {
            padding: 6px 10px;
            font-size: 12px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 32px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface-secondary);
            color: var(--text-primary);
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">📚</div>
                <h2>SmartHub Admin</h2>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link">
                    <span class="icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="students.html" class="nav-link active">
                    <span class="icon">👥</span>
                    <span>Students</span>
                </a>
                <a href="attendance.html" class="nav-link">
                    <span class="icon">✓</span>
                    <span>Attendance</span>
                </a>
                <a href="assignments.html" class="nav-link">
                    <span class="icon">📝</span>
                    <span>Assignments</span>
                </a>
                <a href="study-material.html" class="nav-link">
                    <span class="icon">📚</span>
                    <span>Study Material</span>
                </a>
                <a href="results.html" class="nav-link">
                    <span class="icon">📈</span>
                    <span>Results</span>
                </a>
                <a href="timetable.html" class="nav-link">
                    <span class="icon">📅</span>
                    <span>Timetable</span>
                </a>
                <a href="notices.html" class="nav-link">
                    <span class="icon">📢</span>
                    <span>Notices</span>
                </a>
                <a href="settings.html" class="nav-link">
                    <span class="icon">⚙️</span>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-content">
                    <h1>Student Management</h1>
                    <div class="header-actions">
                        <button class="btn-theme" onclick="toggleTheme()">🌙</button>
                    </div>
                </div>
            </header>

            <!-- Content -->
            <div class="content-area">
                <!-- Toolbar -->
                <div class="admin-toolbar">
                    <div class="search-bar">
                        <input type="text" id="searchInput" placeholder="Search by name, ID, or roll number..." onkeyup="filterStudents()">
                        <button class="btn" onclick="openAddStudentModal()">➕ Add Student</button>
                    </div>
                </div>

                <!-- Students Table -->
                <div class="table-container">
                    <div class="table-wrapper">
                        <table id="studentsTable">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Student ID</th>
                                    <th>Roll No</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Division</th>
                                    <th>CGPA</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="studentsTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Student Modal -->
    <div class="modal" id="studentModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeStudentModal()">✕</button>
            <h2 id="modalTitle">Add New Student</h2>
            <form id="studentForm" onsubmit="saveStudent(event)">
                <div class="form-group">
                    <label>Student Name</label>
                    <input type="text" id="studentName" required>
                </div>
                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" id="studentId" required>
                </div>
                <div class="form-group">
                    <label>Roll Number</label>
                    <input type="text" id="studentRoll" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="studentEmail" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="studentPhone" required>
                </div>
                <div class="form-group">
                    <label>Division</label>
                    <select id="studentDiv" required>
                        <option value="">Select Division</option>
                        <option value="A">Division A</option>
                        <option value="B">Division B</option>
                        <option value="C">Division C</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn">Save Student</button>
                    <button type="button" class="btn secondary" onclick="closeStudentModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        let studentsData = null;
        let editingStudentId = null;

        document.addEventListener('DOMContentLoaded', function() {
            if (!app.checkAuth() || !app.isAdmin()) {
                window.location.href = '../index.html';
                return;
            }

            studentsData = [...SmartHubData.getStudents()];
            displayStudents(studentsData);
        });

        function displayStudents(data) {
            const tbody = document.getElementById('studentsTableBody');

            tbody.innerHTML = data.map(student => `
                <tr>
                    <td><strong>${student.name}</strong></td>
                    <td>${student.id}</td>
                    <td>${student.rollNo}</td>
                    <td>${student.email}</td>
                    <td>${student.phone}</td>
                    <td>${student.division}</td>
                    <td>${student.cgpa}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn btn-sm" onclick="editStudent('${student.id}')">Edit</button>
                            <button class="btn btn-sm danger" onclick="deleteStudent('${student.id}')">Delete</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function filterStudents() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = studentsData.filter(s =>
                s.name.toLowerCase().includes(search) ||
                s.id.toLowerCase().includes(search) ||
                s.rollNo.toLowerCase().includes(search)
            );
            displayStudents(filtered);
        }

        function openAddStudentModal() {
            editingStudentId = null;
            document.getElementById('modalTitle').textContent = 'Add New Student';
            document.getElementById('studentForm').reset();
            document.getElementById('studentModal').classList.add('active');
        }

        function closeStudentModal() {
            document.getElementById('studentModal').classList.remove('active');
        }

        function editStudent(id) {
            const student = studentsData.find(s => s.id === id);
            if (!student) return;

            editingStudentId = id;
            document.getElementById('modalTitle').textContent = 'Edit Student';
            document.getElementById('studentName').value = student.name;
            document.getElementById('studentId').value = student.id;
            document.getElementById('studentRoll').value = student.rollNo;
            document.getElementById('studentEmail').value = student.email;
            document.getElementById('studentPhone').value = student.phone;
            document.getElementById('studentDiv').value = student.division;
            document.getElementById('studentModal').classList.add('active');
        }

        function saveStudent(event) {
            event.preventDefault();

            const studentData = {
                id: document.getElementById('studentId').value,
                name: document.getElementById('studentName').value,
                rollNo: document.getElementById('studentRoll').value,
                email: document.getElementById('studentEmail').value,
                phone: document.getElementById('studentPhone').value,
                division: document.getElementById('studentDiv').value,
                course: 'BCA',
                semester: '6',
                department: 'Computer Science',
                attendance: 85,
                cgpa: 7.5,
                dob: '2002-01-01',
                address: 'Address'
            };

            if (editingStudentId) {
                const index = studentsData.findIndex(s => s.id === editingStudentId);
                if (index !== -1) {
                    studentsData[index] = studentData;
                }
            } else {
                studentsData.push(studentData);
            }

            alert('Student saved successfully!');
            closeStudentModal();
            displayStudents(studentsData);
        }

        function deleteStudent(id) {
            if (confirm('Are you sure you want to delete this student?')) {
                studentsData = studentsData.filter(s => s.id !== id);
                displayStudents(studentsData);
                alert('Student deleted successfully!');
            }
        }
    </script>

</body>
</html>
