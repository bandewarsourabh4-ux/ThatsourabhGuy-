<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments - SmartHub</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .filters-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid var(--border);
            background: var(--surface-secondary);
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: var(--transition);
        }

        .filter-btn:hover {
            border-color: var(--primary);
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .assignment-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            border-left: 4px solid var(--primary);
        }

        .assignment-card.overdue {
            border-left-color: var(--danger);
        }

        .assignment-card.submitted {
            border-left-color: var(--success);
        }

        .assignment-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }

        .assignment-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .assignment-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge.pending {
            background: #fef3c7;
            color: #92400e;
        }

        .badge.submitted {
            background: #dcfce7;
            color: #166534;
        }

        .badge.late {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge.overdue {
            background: #fee2e2;
            color: #991b1b;
        }

        .assignment-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .meta-item {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .meta-item strong {
            color: var(--text-primary);
        }

        .assignment-description {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .assignment-actions {
            display: flex;
            gap: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        @media (max-width: 768px) {
            .filters-section {
                flex-direction: column;
            }

            .assignment-meta {
                grid-template-columns: repeat(2, 1fr);
            }

            .assignment-header {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">📚</div>
                <h2>SmartHub</h2>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link">
                    <span class="icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="profile.html" class="nav-link">
                    <span class="icon">👤</span>
                    <span>Profile</span>
                </a>
                <a href="attendance.html" class="nav-link">
                    <span class="icon">✓</span>
                    <span>Attendance</span>
                </a>
                <a href="assignments.html" class="nav-link active">
                    <span class="icon">📝</span>
                    <span>Assignments</span>
                </a>
                <a href="study-material.html" class="nav-link">
                    <span class="icon">📚</span>
                    <span>Study Material</span>
                </a>
                <a href="results.html" class="nav-link">
                    <span class="icon">📈</span>
                    <span>Results</span>
                </a>
                <a href="timetable.html" class="nav-link">
                    <span class="icon">📅</span>
                    <span>Timetable</span>
                </a>
                <a href="notices.html" class="nav-link">
                    <span class="icon">📢</span>
                    <span>Notices</span>
                </a>
                <a href="settings.html" class="nav-link">
                    <span class="icon">⚙️</span>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-content">
                    <h1>Assignments</h1>
                    <div class="header-actions">
                        <button class="btn-theme" onclick="toggleTheme()">🌙</button>
                    </div>
                </div>
            </header>

            <!-- Content -->
            <div class="content-area">
                <!-- Filters -->
                <div class="filters-section">
                    <button class="filter-btn active" onclick="filterAssignments('all')">All</button>
                    <button class="filter-btn" onclick="filterAssignments('pending')">Pending</button>
                    <button class="filter-btn" onclick="filterAssignments('submitted')">Submitted</button>
                    <button class="filter-btn" onclick="filterAssignments('overdue')">Overdue</button>
                </div>

                <!-- Assignments List -->
                <div id="assignmentsList"></div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>
        let assignmentData = null;
        let currentFilter = 'all';

        document.addEventListener('DOMContentLoaded', function() {
            if (!app.checkAuth()) return;
            assignmentData = SmartHubData.getAssignments();
            displayAssignments('all');
        });

        function filterAssignments(filter) {
            currentFilter = filter;

            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            displayAssignments(filter);
        }

        function displayAssignments(filter) {
            let filtered = assignmentData;

            if (filter === 'pending') {
                filtered = assignmentData.filter(a => a.status === 'Pending');
            } else if (filter === 'submitted') {
                filtered = assignmentData.filter(a => a.status === 'Submitted');
            } else if (filter === 'overdue') {
                filtered = assignmentData.filter(a => isOverdue(a.dueDate) && a.status === 'Pending');
            }

            const container = document.getElementById('assignmentsList');

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 48px; margin-bottom: 12px;">📋</div>
                        <h3>No assignments found</h3>
                        <p style="color: var(--text-secondary); margin-top: 8px;">
                            ${filter === 'all' ? 'You have no assignments yet.' : 'No assignments matching this filter.'}
                        </p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(assignment => {
                const status = assignment.status.toLowerCase();
                const daysLeft = Math.ceil((new Date(assignment.dueDate) - new Date()) / (1000 * 60 * 60 * 24));
                let statusClass = status === 'submitted' ? 'submitted' : (isOverdue(assignment.dueDate) ? 'overdue' : '');

                return `
                    <div class="assignment-card ${statusClass}">
                        <div class="assignment-header">
                            <div class="assignment-title">${assignment.title}</div>
                            <span class="assignment-badge badge ${status === 'submitted' ? 'submitted' : (isOverdue(assignment.dueDate) ? 'overdue' : 'pending')}">
                                ${status === 'submitted' ? '✓ ' : (isOverdue(assignment.dueDate) ? '⚠️ ' : '')}${isOverdue(assignment.dueDate) ? 'Overdue' : assignment.status}
                            </span>
                        </div>

                        <div class="assignment-meta">
                            <div class="meta-item">
                                <strong>📚 Subject:</strong> ${assignment.subject}
                            </div>
                            <div class="meta-item">
                                <strong>👨‍🏫 Faculty:</strong> ${assignment.faculty}
                            </div>
                            <div class="meta-item">
                                <strong>📅 Due:</strong> ${formatDate(assignment.dueDate)}
                                ${daysLeft > 0 && !isOverdue(assignment.dueDate) ? ` (${daysLeft} days left)` : ''}
                            </div>
                            <div class="meta-item">
                                <strong>📤 Submission:</strong> ${assignment.submissionStatus}
                            </div>
                        </div>

                        <div class="assignment-description">
                            ${assignment.description}
                        </div>

                        <div class="assignment-actions">
                            ${assignment.status === 'Pending' ? `<button class="btn btn-sm">Submit Assignment</button>` : ''}
                            <button class="btn btn-sm secondary">View Details</button>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>

</body>
</html>
